<!DOCTYPE html>
<html>
<head>
    <title>Convertitore Pages → DOCX</title>
</head>
<body>
    <h1>Converti file .pages in .docx</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".pages" required>
        <button type="submit">Converti</button>
    </form>
</body>
</html>
